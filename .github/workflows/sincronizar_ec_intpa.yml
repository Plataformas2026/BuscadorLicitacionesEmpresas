name: Sincronizar Licitaciones (EC - INTPA)

on:
  schedule:
    - cron: '0 2 * * *'   # todos los dias a las 02:00 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar el navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar sincronizacion EC - INTPA
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_ec_intpa.py

      - name: Subir captura de depuracion (listado y primera ficha)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-ec-intpa
          path: |
            ingest/debug_ec_intpa_listado.html
            ingest/debug_ec_intpa_ficha.html
          if-no-files-found: ignore
          retention-days: 7
