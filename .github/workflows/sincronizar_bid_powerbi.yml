name: Sincronización BID PowerBI

on:
  schedule:
    # Todos los días a las 06:00 UTC
    - cron: "0 6 * * *"

  # Permite ejecutar manualmente el workflow
  workflow_dispatch:

jobs:
  ingesta-bid:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar Chromium de Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Verificar estructura del proyecto
        run: |
          echo "Directorio de trabajo:"
          pwd

          echo ""
          echo "Archivos relevantes:"
          ls -la
          ls -la app
          ls -la ingest

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Playwright:"
          python -m playwright --version

      - name: Ejecutar ingesta BID
        env:
          PYTHONUNBUFFERED: "1"

          # El root del repositorio queda disponible para:
          # from app.common import ...
          # o imports de otros módulos del proyecto.
          PYTHONPATH: ${{ github.workspace }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python -m ingest.ingesta_bid_powerbi

      - name: Guardar captura de Power BI si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-debug
          path: |
            powerbi_tabla_extraida.png
            ingest/powerbi_tabla_extraida.png
          if-no-files-found: ignore
