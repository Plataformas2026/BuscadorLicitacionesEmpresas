name: Sincronización BID PowerBI

on:
  schedule:
    - cron: '0 6 * * *'   # Todos los días a las 06:00 UTC
  workflow_dispatch:

jobs:
  ingesta-bid:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt   # ajusta si está en otra ruta

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium y dependencias del sistema
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar ingesta BID
        working-directory: ingest
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ingesta_bid_powerbi.py

      - name: Subir diagnóstico (capturas y HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-debug
          path: ingest/debug/
          if-no-files-found: ignore
          retention-days: 7
