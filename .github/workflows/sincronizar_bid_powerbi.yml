name: Sincronizar Licitaciones (BID PowerBI)

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 06:00 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright y dependencias del sistema
        run: |
          npx playwright install chromium --with-deps

      - name: Ejecutar sincronización BID PowerBI
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ingesta_bid_powerbi.py

      - name: Guardar captura de depuración en caso de error o verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-screenshot
          path: ingest/powerbi_tabla_extraida.png
          if-no-files-found: ignore
