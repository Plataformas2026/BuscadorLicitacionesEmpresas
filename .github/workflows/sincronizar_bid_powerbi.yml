name: Sincronización BID PowerBI

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  ingesta-bid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias del sistema, fuentes y Xvfb (Entorno gráfico tipo Colab)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-liberation libnss3 libgbm-dev libasound2
          npx playwright install-deps chromium
          python -m playwright install chromium

      - name: Ejecutar ingesta BID en Pantalla Virtual (Xvfb)
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" python ingesta_bid_powerbi.py
