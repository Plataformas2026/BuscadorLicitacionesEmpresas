name: Sincronización BID PowerBI

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  ingesta-bid:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar Chromium y dependencias
        run: |
          python -m playwright install --with-deps chromium

      - name: Verificar estructura del proyecto
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== INGEST ==="
          ls -la ingest

          echo "=== PYTHON ==="
          python --version

          echo "=== PLAYWRIGHT ==="
          python -m playwright --version

      - name: Verificar import de common
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import common; print('OK: common.py cargado desde:', common.__file__)"

      - name: Ejecutar ingesta BID
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python -m ingest.ingesta_bid_powerbi

      - name: Guardar captura de Power BI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-debug
          path: |
            powerbi_tabla_extraida.png
            ingest/powerbi_tabla_extraida.png
          if-no-files-found: ignore
