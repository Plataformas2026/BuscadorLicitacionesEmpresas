name: Sincronización BID PowerBI

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingesta-bid:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar Chromium y dependencias
        run: |
          python -m playwright install --with-deps chromium

      - name: Verificar estructura del proyecto
        run: |
          echo "========================================"
          echo "ROOT"
          echo "========================================"
          pwd
          ls -la

          echo "========================================"
          echo "APP"
          echo "========================================"
          test -d app || {
            echo "ERROR: no existe app/"
            exit 1
          }
          ls -la app

          echo "========================================"
          echo "INGEST"
          echo "========================================"
          test -d ingest || {
            echo "ERROR: no existe ingest/"
            exit 1
          }
          ls -la ingest

          echo "========================================"
          echo "COMMON"
          echo "========================================"
          test -f ingest/common.py || {
            echo "ERROR: no existe ingest/common.py"
            exit 1
          }

          echo "OK: ingest/common.py existe"
          ls -l ingest/common.py

          echo "========================================"
          echo "PYTHON"
          echo "========================================"
          python --version

          echo "========================================"
          echo "PLAYWRIGHT"
          echo "========================================"
          python -m playwright --version

      - name: Verificar import de common
        env:
          PYTHONPATH: ${{ github.workspace }}/ingest
        run: |
          python -c "import common; print('OK: common.py cargado desde:', common.__file__)"

      - name: Verificar funciones de common
        env:
          PYTHONPATH: ${{ github.workspace }}/ingest
        run: |
          python - <<'PY'
          import common

          funciones = [
              "generar_embedding",
              "obtener_cliente_supabase",
              "obtener_registros_existentes",
              "subir_en_lotes",
          ]

          print("common.py:", common.__file__)

          for nombre in funciones:
              if not hasattr(common, nombre):
                  raise RuntimeError(
                      f"Falta la función {nombre} en common.py"
                  )

              print(f"OK: {nombre}")

          print("Todas las funciones de common.py están disponibles.")
          PY

      - name: Ejecutar ingesta BID
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/ingest

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python -m ingest.ingesta_bid_powerbi

      - name: Guardar captura de Power BI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-debug
          path: |
            powerbi_tabla_extraida.png
            ingest/powerbi_tabla_extraida.png
          if-no-files-found: ignore
