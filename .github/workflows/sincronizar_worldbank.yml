name: Sincronizar Licitaciones (World Bank)

on:
  schedule:
    - cron: '30 8 * * *'   # todos los dias a las 08:30 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar el navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar sincronizacion World Bank
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_worldbank.py

      - name: Subir captura de depuracion (si el script no reconocio ninguna fila)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-worldbank-tabla
          path: ingest/debug_worldbank_tabla.png
          if-no-files-found: ignore
          retention-days: 7
