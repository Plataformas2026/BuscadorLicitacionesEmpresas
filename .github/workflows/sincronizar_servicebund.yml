name: Sincronizar Licitaciones (Service-Bund - GIZ)

on:
  schedule:
    - cron: '30 9 * * *'   # todos los dias a las 09:30 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Igual que TED, esta fuente usa un feed RSS oficial en vez de
      # Playwright -- ver docstring de ingesta_servicebund.py -- así que
      # no hace falta instalar ningún navegador.

      - name: Ejecutar sincronizacion Service-Bund
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_servicebund.py
