name: Sincronizar Licitaciones (Enabel)

on:
  schedule:
    - cron: '0 1 * * *'   # todos los dias a las 01:00 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Este script no usa Playwright (scraping directo con requests +
      # BeautifulSoup, ver docstring de ingesta_enabel.py), así que no hace
      # falta instalar ningún navegador.

      - name: Ejecutar sincronizacion Enabel
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_enabel.py

      - name: Subir captura de depuracion (si el script no detecto ninguna licitacion)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-enabel-listado
          path: ingest/debug_enabel_listado.html
          if-no-files-found: ignore
          retention-days: 7
