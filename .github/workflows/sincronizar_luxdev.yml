name: Sincronizar Licitaciones (LuxDev)

on:
  schedule:
    - cron: "45 0 * * *"   # todos los dias a las 00:45 UTC
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Este script no usa Playwright (scraping directo con requests +
      # BeautifulSoup, ver docstring de ingesta_luxdev.py), asi que no hace
      # falta instalar ningun navegador.

      - name: Ejecutar sincronizacion LuxDev
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_luxdev.py

      - name: Subir captura de depuracion (si el script no detecto ningun proyecto)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-luxdev-listado
          path: ingest/debug_luxdev_listado.html
          if-no-files-found: ignore
          retention-days: 7
