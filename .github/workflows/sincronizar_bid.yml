name: Sincronizar Licitaciones (BID)

on:
  schedule:
    - cron: '30 6 * * *'   # todos los dias a las 06:30 UTC (30 min despues del AfDB)
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar el navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar sincronizacion BID
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_bid.py

      # Ver aviso de fiabilidad en ingesta_bid.py: si no se reconoce
      # ninguna fila, el script guarda una captura de pantalla del
      # informe tal cual lo vio el navegador. Se sube como artefacto
      # descargable desde la propia ejecucion en GitHub Actions (pestaña
      # "Summary" -> "Artifacts") para poder ver que encontro sin tener
      # que reproducirlo en local.
      - name: Subir captura de depuracion (si el script no reconocio ninguna fila)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-bid-powerbi
          path: ingest/debug_bid_powerbi.png
          if-no-files-found: ignore
          retention-days: 7
