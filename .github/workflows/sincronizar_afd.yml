name: Sincronizar Licitaciones (AFD)

on:
  schedule:
    - cron: '30 7 * * *'    # Todos los días a las 06:30 UTC (desfasado 30 min respecto a AfDB)
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar sincronización AFD
        working-directory: ingest  # Ajusta esta línea si tu script no está en una carpeta 'ingest'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingesta_afd.py
